<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoShop Admin - Quản lý sản phẩm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- HEADER -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-x-4">
                    <a href="abc.html" class="text-emerald-600 hover:text-emerald-700">
                        <i class="fa-solid fa-arrow-left text-xl"></i>
                    </a>
                    <div class="flex items-center gap-x-3">
                        <div class="w-10 h-10 bg-emerald-600 rounded-2xl flex items-center justify-center text-white text-xl shadow-inner">
                            ⚙️
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold text-gray-900">EcoShop Admin</h1>
                            <p class="text-sm text-gray-500">Quản lý sản phẩm</p>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-x-4">
                    <div class="text-sm text-gray-600">
                        <i class="fa-solid fa-clock mr-2"></i>
                        <span id="current-time"></span>
                    </div>
                    <button onclick="exportProducts()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
                        <i class="fa-solid fa-download mr-2"></i>Xuất dữ liệu
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-6 py-8">
        <!-- STATS CARDS -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-xl p-6 shadow-sm border">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600">Tổng sản phẩm</p>
                        <p class="text-2xl font-bold text-gray-900" id="total-products">0</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                        <i class="fa-solid fa-box text-blue-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl p-6 shadow-sm border">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600">Tổng giá trị</p>
                        <p class="text-2xl font-bold text-gray-900" id="total-value">0đ</p>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                        <i class="fa-solid fa-dollar-sign text-green-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl p-6 shadow-sm border">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600">Sản phẩm HOT</p>
                        <p class="text-2xl font-bold text-gray-900" id="hot-products">0</p>
                    </div>
                    <div class="w-12 h-12 bg-red-100 rounded-lg flex items-center justify-center">
                        <i class="fa-solid fa-fire text-red-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl p-6 shadow-sm border">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600">Sản phẩm NEW</p>
                        <p class="text-2xl font-bold text-gray-900" id="new-products">0</p>
                    </div>
                    <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                        <i class="fa-solid fa-star text-purple-600 text-xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- ACTIONS BAR -->
        <div class="bg-white rounded-xl p-6 shadow-sm border mb-8">
            <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between">
                <div class="flex items-center gap-x-4">
                    <button onclick="showAddProductModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-lg font-medium flex items-center gap-x-2">
                        <i class="fa-solid fa-plus"></i>
                        Thêm sản phẩm
                    </button>
                    <button onclick="refreshProducts()" class="bg-gray-600 hover:bg-gray-700 text-white px-6 py-3 rounded-lg font-medium flex items-center gap-x-2">
                        <i class="fa-solid fa-refresh"></i>
                        Làm mới
                    </button>
                </div>
                <div class="flex items-center gap-x-4">
                    <select id="filter-badge" onchange="filterProducts()" class="border border-gray-300 rounded-lg px-4 py-2 text-sm">
                        <option value="">Tất cả badge</option>
                        <option value="HOT">HOT</option>
                        <option value="NEW">NEW</option>
                        <option value="BEST">BEST</option>
                    </select>
                    <div class="relative">
                        <input type="text" id="search-admin" placeholder="Tìm sản phẩm..." class="border border-gray-300 rounded-lg pl-10 pr-4 py-2 text-sm w-64">
                        <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- PRODUCTS TABLE -->
        <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
            <div class="px-6 py-4 border-b bg-gray-50">
                <h2 class="text-lg font-semibold text-gray-900">Danh sách sản phẩm</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50 border-b">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Hình ảnh</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tên sản phẩm</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Giá</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Badge</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="products-table-body" class="divide-y divide-gray-200">
                        <!-- Products will be populated here -->
                    </tbody>
                </table>
            </div>
            <div id="empty-state" class="hidden px-6 py-12 text-center text-gray-500">
                <i class="fa-solid fa-box-open text-6xl mb-4 text-gray-300"></i>
                <p>Chưa có sản phẩm nào</p>
            </div>
        </div>
    </main>

    <!-- ADD/EDIT PRODUCT MODAL -->
    <div id="product-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl max-w-md w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div class="px-6 py-4 border-b">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-semibold text-gray-900" id="modal-title">Thêm sản phẩm mới</h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                        <i class="fa-solid fa-times text-xl"></i>
                    </button>
                </div>
            </div>
            <form id="product-form" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Tên sản phẩm</label>
                    <input type="text" id="product-name" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Giá (VNĐ)</label>
                    <input type="number" id="product-price" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">URL hình ảnh</label>
                    <input type="url" id="product-image" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Badge (tùy chọn)</label>
                    <select id="product-badge" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="">Không có</option>
                        <option value="HOT">HOT</option>
                        <option value="NEW">NEW</option>
                        <option value="BEST">BEST</option>
                    </select>
                </div>
                <div class="flex gap-x-3 pt-4">
                    <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg font-medium">
                        <i class="fa-solid fa-save mr-2"></i>Lưu
                    </button>
                    <button type="button" onclick="closeModal()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-700 py-2 rounded-lg font-medium">
                        Hủy
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- DELETE CONFIRMATION MODAL -->
    <div id="delete-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl max-w-sm w-full mx-4">
            <div class="px-6 py-4 border-b">
                <h3 class="text-lg font-semibold text-gray-900">Xác nhận xóa</h3>
            </div>
            <div class="p-6">
                <p class="text-gray-600 mb-6">Bạn có chắc chắn muốn xóa sản phẩm này? Hành động này không thể hoàn tác.</p>
                <div class="flex gap-x-3">
                    <button onclick="confirmDelete()" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg font-medium">
                        Xóa
                    </button>
                    <button onclick="closeDeleteModal()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-700 py-2 rounded-lg font-medium">
                        Hủy
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
