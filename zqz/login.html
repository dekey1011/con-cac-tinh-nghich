<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - EcoShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="bg-gradient-to-br from-emerald-50 to-teal-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <!-- Header -->
        <div class="text-center mb-8">
            <a href="abc.html" class="inline-flex items-center gap-x-3 text-emerald-600 hover:text-emerald-700 mb-6">
                <div class="w-10 h-10 bg-emerald-600 rounded-2xl flex items-center justify-center text-white text-xl shadow-inner">
                    🌱
                </div>
                <span class="text-2xl font-bold heading-font">EcoShop</span>
            </a>
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Chào mừng trở lại</h1>
            <p class="text-gray-600">Đăng nhập để tiếp tục hành trình sống xanh</p>
        </div>

        <!-- Login Form -->
        <div class="bg-white rounded-3xl shadow-xl p-8">
            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email hoặc số điện thoại</label>
                    <div class="relative">
                        <input type="text" id="login-email" required
                               class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all"
                               placeholder="Nhập email hoặc số điện thoại">
                        <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Mật khẩu</label>
                    <div class="relative">
                        <input type="password" id="login-password" required
                               class="w-full pl-12 pr-12 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all"
                               placeholder="Nhập mật khẩu">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <button type="button" onclick="togglePassword('login-password')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i class="fa-solid fa-eye" id="login-eye-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" id="remember-me" class="rounded border-gray-300 text-emerald-600 focus:ring-emerald-500">
                        <span class="ml-2 text-sm text-gray-600">Ghi nhớ đăng nhập</span>
                    </label>
                    <a href="#" class="text-sm text-emerald-600 hover:text-emerald-700 font-medium">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-xl font-semibold text-lg transition-colors">
                    <i class="fa-solid fa-sign-in-alt mr-2"></i>
                    Đăng nhập
                </button>
            </form>

            <!-- Social Login -->
            <div class="mt-8">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-white text-gray-500">hoặc đăng nhập với</span>
                    </div>
                </div>

                <div class="mt-6 grid grid-cols-2 gap-4">
                    <button onclick="loginWithGoogle()" class="flex items-center justify-center px-4 py-3 border border-gray-300 rounded-xl hover:bg-gray-50 transition-colors">
                        <i class="fa-brands fa-google text-red-500 mr-3"></i>
                        <span class="text-sm font-medium">Google</span>
                    </button>
                    <button onclick="loginWithFacebook()" class="flex items-center justify-center px-4 py-3 border border-gray-300 rounded-xl hover:bg-gray-50 transition-colors">
                        <i class="fa-brands fa-facebook text-blue-600 mr-3"></i>
                        <span class="text-sm font-medium">Facebook</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-8">
            <p class="text-gray-600">
                Chưa có tài khoản?
                <a href="signup.html" class="text-emerald-600 hover:text-emerald-700 font-semibold">Đăng ký ngay</a>
            </p>
        </div>

        <!-- Demo Credentials -->
        <div class="mt-6 bg-blue-50 border border-blue-200 rounded-xl p-4">
            <h4 class="text-sm font-semibold text-blue-900 mb-2">Tài khoản demo:</h4>
            <p class="text-xs text-blue-800">Email: demo@ecoshop.vn</p>
            <p class="text-xs text-blue-800">Mật khẩu: demo123</p>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
